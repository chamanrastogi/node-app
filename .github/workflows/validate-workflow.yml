name: Validate File
on: 
  workflow_dispatch:
jobs:
    validate-file:
     runs-on: ubuntu-latest
     steps:
        - name: get-repo-code
          uses: actions/checkout@v5
       
        - name: validate Html file
          run: test -f index.html

        - name: validate js file
          run: test -f script.js

        - name: validate js code
          run: node --check script.js  

 